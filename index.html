<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#08111e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="assets/icon-192.png">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<title>Travel Companion Alpha</title>
<style>
:root{--bg:#07111f;--panel:#0d1b2d;--panel2:#13243a;--line:#28415f;--text:#f7f9fc;--muted:#aeb9c8;--accent:#ff7a1a;--green:#4fd17a;--blue:#5ba9ff}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;overflow:hidden}
button{font:inherit}.app{height:100dvh;display:grid;grid-template-rows:auto 1fr}
.top{display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 12px 10px;background:#07111fee;border-bottom:1px solid var(--line);z-index:1001}
.logo{width:38px;height:38px;border-radius:12px;background:#b20d21;display:grid;place-items:center}.title{min-width:0}.title b,.title span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.title span{font-size:12px;color:var(--muted)}.grow{flex:1}
.icon{border:1px solid var(--line);background:#102139;color:white;border-radius:12px;height:40px;min-width:40px;padding:0 10px}
.work{position:relative;min-height:0}#map{position:absolute;inset:0}.leaflet-control-attribution{font-size:9px}
.sheet{position:absolute;left:0;right:0;bottom:0;height:145px;background:linear-gradient(#0e2035,#091727);border:1px solid var(--line);border-bottom:0;border-radius:24px 24px 0 0;z-index:900;transition:height .25s;overflow:hidden;box-shadow:0 -18px 45px #0008}
.sheet.mid{height:62%}.sheet.full{height:92%}.handle-zone{padding:9px 0 6px}.handle{width:52px;height:5px;border-radius:99px;background:#64758a;margin:auto}
.sheet-head{display:flex;gap:10px;align-items:center;padding:0 14px 12px}.sheet-head img{width:76px;height:58px;object-fit:cover;border-radius:12px}.sheet-main{min-width:0;flex:1}.sheet-main h2{font-size:19px;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sheet-main p{margin:3px 0 0;color:var(--muted);font-size:13px}.progress{font-size:13px;color:#9df1b5}
.content{height:calc(100% - 92px);overflow:auto;padding:0 14px 105px}.tabs{display:flex;gap:7px;overflow:auto;padding-bottom:12px;position:sticky;top:0;background:#0e2035;z-index:4}.tab{white-space:nowrap;border:1px solid var(--line);background:#152a45;color:var(--muted);padding:9px 12px;border-radius:99px}.tab.on{background:var(--accent);color:white;border-color:transparent}
.section-title{display:flex;justify-content:space-between;align-items:center;margin:9px 0}.section-title h3{font-size:16px;margin:0}.muted{font-size:13px;color:var(--muted)}
.timeline{display:grid;gap:9px}.stop{display:grid;grid-template-columns:34px 66px 1fr auto;gap:9px;align-items:center;background:#102139;border:1px solid var(--line);border-radius:16px;padding:9px}.stop img{width:66px;height:54px;object-fit:cover;border-radius:10px}.num{width:30px;height:30px;border-radius:50%;background:var(--accent);display:grid;place-items:center;font-weight:800}.stop.done{opacity:.55}.stop b{display:block}.check{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:#0a1728;color:white}.check.done{background:var(--green);border:0}
.cards{display:grid;gap:10px}.place-card{display:grid;grid-template-columns:92px 1fr;gap:11px;background:#102139;border:1px solid var(--line);border-radius:17px;padding:10px}.place-card img{width:92px;height:82px;object-fit:cover;border-radius:12px}.place-card h3{margin:0 0 4px;font-size:16px}.place-card p{margin:0;color:var(--muted);font-size:13px}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}.small{border:1px solid var(--line);background:#152a45;color:white;border-radius:10px;padding:8px 10px}
.hero{height:190px;border-radius:18px;background-size:cover;background-position:center;display:flex;align-items:end;padding:16px;box-shadow:inset 0 -90px 70px #0009}.hero h2{margin:0;font-size:28px}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0}.metric{background:#152a45;border-radius:12px;padding:9px;text-align:center;font-size:11px}.metric b{display:block;font-size:14px}.guide p{color:var(--muted);line-height:1.55}
.status{position:absolute;left:12px;top:12px;z-index:700;background:#0d1b2dee;border:1px solid var(--line);border-radius:99px;padding:7px 10px;font-size:12px}.maptools{position:absolute;right:12px;top:12px;z-index:700;display:grid;gap:8px}.maptools button{width:44px;height:44px;border-radius:14px;border:1px solid var(--line);background:#0d1b2dee;color:white}
.hub{position:absolute;right:14px;bottom:158px;z-index:950;width:54px;height:54px;border-radius:50%;border:0;background:var(--accent);color:white;font-size:22px;box-shadow:0 10px 30px #0009}.hubmenu{position:absolute;right:14px;bottom:222px;z-index:960;width:min(300px,calc(100% - 28px));display:none;background:#0e2035;border:1px solid var(--line);border-radius:18px;padding:9px}.hubmenu.open{display:block}.hubmenu button{width:100%;text-align:left;border:0;background:transparent;color:white;padding:12px;border-radius:11px}
.toast{position:absolute;left:50%;bottom:165px;transform:translateX(-50%);z-index:1100;background:#07111f;border:1px solid var(--line);border-radius:99px;padding:8px 12px;display:none;white-space:nowrap}.toast.show{display:block}
@media(orientation:landscape) and (max-height:650px){.work{display:grid;grid-template-columns:1.55fr .85fr}#map{position:relative;grid-column:1}.sheet,.sheet.mid,.sheet.full{position:relative;grid-column:2;height:auto!important;border-radius:0;border-top:0}.handle-zone{display:none}.hub{right:calc(36% + 14px);bottom:14px}.hubmenu{right:calc(36% + 14px);bottom:76px}}
</style>
</head>
<body>
<div class="app">
<header class="top"><div class="logo">🇩🇰</div><div class="title"><b>Travel Companion Alpha</b><span>Koppenhága · Mai nap</span></div><div class="grow"></div><button class="icon" id="sync">↻</button><button class="icon" id="layers">▱</button></header>
<main class="work">
<div id="map"></div>
<div class="status" id="status">🟢 Friss · demo</div>
<div class="maptools"><button id="gps">◎</button><button id="radar">◉</button></div>
<button class="hub" id="hub">◎</button>
<div class="hubmenu" id="hubmenu"><button>📅 Mai nap</button><button>🧳 Utazások</button><button>🌍 My Travels</button><button>⚙ Beállítások</button></div>
<section class="sheet" id="sheet">
<div class="handle-zone" id="handle"><div class="handle"></div></div>
<div class="sheet-head"><img id="nextImg" src="assets/images/torvehallerne.jpg"><div class="sheet-main"><h2 id="nextName">Következő: Torvehallerne</h2><p id="nextMeta">10:00 · 40–60 perc</p></div><div class="progress" id="progress">0 / 6</div></div>
<div class="content">
<div class="tabs"><button class="tab on" data-view="timeline">Idővonal</button><button class="tab" data-view="around">Körülöttem</button><button class="tab" data-view="guide">Guide</button><button class="tab" data-view="saved">Mentettek</button></div>
<div id="timeline"></div><div id="around" hidden></div><div id="guide" hidden></div><div id="saved" hidden></div>
</div>
</section>
<div class="toast" id="toast"></div>
</main></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const places=[{"id": "torvehallerne", "name": "Torvehallerne", "category": "Kaja", "lat": 55.68385, "lng": 12.56915, "image": "assets/images/torvehallerne.jpg", "rating": "4,6", "duration": "40–60 perc", "price": "Költéstől függ", "worth": "Megéri, ha helyi ételeket és gyors ebédet keresel.", "short": "Két üvegcsarnokból álló modern vásárcsarnok az Israels Plads mellett.", "story": "A Torvehallerne nem hagyományos turistalátványosság, hanem működő városi piac. Jó hely smørrebrød, péksütemény, kávé vagy kisebb ebéd kipróbálására. A környék a Rundetårn és Rosenborg felé vezető útba is könnyen beilleszthető.", "tip": "Ebédidőben zsúfoltabb; délelőtt nyugodtabb körülnézni.", "time": "10:00"}, {"id": "rundetaarn", "name": "Rundetårn", "category": "Látnivaló", "lat": 55.68138, "lng": 12.57583, "image": "assets/images/rundetaarn.jpg", "rating": "4,5", "duration": "35–50 perc", "price": "Belépős", "worth": "Kompakt program, érdekes épület és jó belvárosi panoráma.", "short": "17. századi csillagászati torony jellegzetes spirális rámpával.", "story": "A Rundetårn IV. Keresztély király tudományos épületegyüttesének részeként készült. A tetejére nagyrészt lépcső helyett egy széles, spirálisan emelkedő folyosó vezet. Fent a régi belváros háztetői és tornyai nyílnak meg előtted.", "tip": "A panoráma tiszta időben a legjobb; a keskeny felső részen várakozás lehet.", "time": "11:10"}, {"id": "rosenborg", "name": "Rosenborg kastély", "category": "Látnivaló", "lat": 55.68548, "lng": 12.57806, "image": "assets/images/rosenborg.jpg", "rating": "4,6", "duration": "60–90 perc", "price": "Belépős", "worth": "A kastély belseje és a koronázási ékszerek miatt erős főprogram.", "short": "Reneszánsz királyi kastély a Kongens Have parkban.", "story": "Rosenborgot IV. Keresztély nyári rezidenciaként építtette. A kastély ma múzeum, és itt őrzik a dán koronázási ékszereket. A körülötte elterülő Királyi Kert önmagában is kellemes pihenőhely.", "tip": "Ha nincs időd a belső kiállításra, a park és a kastély külsője ingyenesen is jó megálló.", "time": "12:10"}, {"id": "nyhavn", "name": "Nyhavn", "category": "Látnivaló", "lat": 55.67969, "lng": 12.59131, "image": "assets/images/nyhavn.jpg", "rating": "4,8", "duration": "30–50 perc", "price": "Ingyenes", "worth": "Első koppenhágai úton kihagyhatatlan, de elég végigsétálni és leülni a víznél.", "short": "Színes történelmi kikötő, hajókkal, teraszokkal és klasszikus városképpel.", "story": "Nyhavn a 17. században kereskedelmi kikötőként kötötte össze a várost a tengerrel. A környék egykor tengerészekkel, raktárakkal és vendéglőkkel volt tele; ma Koppenhága legismertebb vízparti találkozóhelye. Hans Christian Andersen több házban is lakott az utcában.", "tip": "A túlpart felől kapod a legismertebb színes házsoros fotót. Kora reggel jóval nyugodtabb.", "time": "14:15"}, {"id": "amalienborg", "name": "Amalienborg", "category": "Látnivaló", "lat": 55.684, "lng": 12.59312, "image": "assets/images/amalienborg.jpg", "rating": "4,6", "duration": "35–55 perc", "price": "Tér ingyenes", "worth": "A palotatér és az őrségváltás miatt jól illik a kikötői sétába.", "short": "Négy rokokó palotából álló királyi rezidencia egy nyolcszögletű tér körül.", "story": "Amalienborg eredetileg négy előkelő család palotája volt. A királyi család 1794 után költözött ide, amikor Christiansborg leégett. A tér közepén V. Frigyes lovasszobra áll, a tengely végén pedig a Márványtemplom kupolája látszik.", "tip": "Az őrségváltás idején többen vannak; máskor a tér sokkal jobban áttekinthető.", "time": "15:05"}, {"id": "littlemermaid", "name": "A kis hableány", "category": "Látnivaló", "lat": 55.69286, "lng": 12.59928, "image": "assets/images/little_mermaid.jpg", "rating": "3,8", "duration": "15–25 perc", "price": "Ingyenes", "worth": "Maga a szobor kicsi, de a Kastellet és a vízparti séta részeként megéri.", "short": "Koppenhága híres bronzszobra a Langelinie vízpartján.", "story": "A szobrot Hans Christian Andersen meséje ihlette, és 1913 óta ül a kikötő szikláin. Mérete gyakran meglepi a látogatókat, ezért önálló célpontként kevésbé erős, mint a környező vízparttal és Kastellettel együtt.", "tip": "A legjobb úgy tervezni, hogy Amalienborg felől a Kastelleten át sétálsz ide.", "time": "16:20"}];
const state=JSON.parse(localStorage.getItem('tc-alpha-state')||'{}');
state.done=state.done||[];state.saved=state.saved||[];state.selected=state.selected||places[0].id;
const save=()=>localStorage.setItem('tc-alpha-state',JSON.stringify(state));
const byId=id=>places.find(p=>p.id===id);
const map=L.map('map',{zoomControl:false}).setView([55.684,12.585],14);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap contributors'}).addTo(map);
const line=L.polyline(places.map(p=>[p.lat,p.lng]),{color:'#318cff',weight:5,opacity:.8,dashArray:'8 8'}).addTo(map);
const markers={};
places.forEach((p,i)=>{markers[p.id]=L.marker([p.lat,p.lng]).addTo(map).bindTooltip(`${i+1}. ${p.name}`);markers[p.id].on('click',()=>selectPlace(p.id,true));});
function selectPlace(id,openGuide=false){
 state.selected=id;save();const p=byId(id);
 document.getElementById('nextImg').src=p.image;document.getElementById('nextName').textContent='Következő: '+p.name;document.getElementById('nextMeta').textContent=p.time+' · '+p.duration;
 map.panTo([p.lat,p.lng]);renderGuide();
 if(openGuide) switchView('guide');
}
function renderTimeline(){
 const box=document.getElementById('timeline');
 box.innerHTML='<div class="section-title"><h3>Mai útiterv</h3><span class="muted">Valós koppenhágai helyek</span></div><div class="timeline">'+places.map((p,i)=>`<article class="stop ${state.done.includes(p.id)?'done':''}" data-id="${p.id}"><div class="num">${i+1}</div><img src="${p.image}"><div><b>${p.name}</b><span class="muted">${p.time} · ${p.duration}</span></div><button class="check ${state.done.includes(p.id)?'done':''}" data-check="${p.id}">${state.done.includes(p.id)?'✓':'○'}</button></article>`).join('')+'</div>';
 box.querySelectorAll('.stop').forEach(el=>el.addEventListener('click',e=>{if(!e.target.dataset.check)selectPlace(el.dataset.id,true)}));
 box.querySelectorAll('[data-check]').forEach(btn=>btn.addEventListener('click',e=>{e.stopPropagation();const id=btn.dataset.check;state.done=state.done.includes(id)?state.done.filter(x=>x!==id):[...state.done,id];save();renderAll();}));
}
function renderAround(){
 const box=document.getElementById('around');
 box.innerHTML='<div class="section-title"><h3>Körülöttem</h3><span class="muted">Demo · 2 km</span></div><div class="cards">'+places.map(p=>`<article class="place-card"><img src="${p.image}"><div><h3>${p.name}</h3><p>${p.category} · ⭐ ${p.rating}</p><p>${p.short}</p><div class="actions"><button class="small" data-open="${p.id}">Részletek</button><button class="small" data-save="${p.id}">${state.saved.includes(p.id)?'Mentve ✓':'Későbbre'}</button></div></div></article>`).join('')+'</div>';
 box.querySelectorAll('[data-open]').forEach(b=>b.addEventListener('click',()=>selectPlace(b.dataset.open,true)));
 box.querySelectorAll('[data-save]').forEach(b=>b.addEventListener('click',()=>toggleSaved(b.dataset.save)));
}
function renderGuide(){
 const p=byId(state.selected);const box=document.getElementById('guide');
 box.innerHTML=`<div class="hero" style="background-image:url('${p.image}')"><h2>${p.name}</h2></div><div class="metrics"><div class="metric"><b>⭐ ${p.rating}</b>Értékelés</div><div class="metric"><b>${p.duration}</b>Idő</div><div class="metric"><b>${p.price}</b>Ár</div><div class="metric"><b>${p.category}</b>Típus</div></div><div class="actions"><button class="small" id="routeBtn">Útvonal</button><button class="small" id="saveBtn">${state.saved.includes(p.id)?'Mentve ✓':'📌 Későbbre'}</button><button class="small" id="doneBtn">${state.done.includes(p.id)?'Megnézve ✓':'○ Megnéztem'}</button></div><div class="guide"><h3>Megéri?</h3><p>${p.worth}</p><h3>Mi ez?</h3><p>${p.short}</p><h3>Bővebben · mini Guide</h3><p>${p.story}</p><h3>Helyi tipp</h3><p>${p.tip}</p></div>`;
 document.getElementById('saveBtn').onclick=()=>toggleSaved(p.id);
 document.getElementById('doneBtn').onclick=()=>{state.done=state.done.includes(p.id)?state.done.filter(x=>x!==p.id):[...state.done,p.id];save();renderAll();};
 document.getElementById('routeBtn').onclick=()=>{map.fitBounds([[p.lat,p.lng],[55.684,12.585]],{padding:[60,60]});toast('Útvonal kiemelve a térképen');};
}
function renderSaved(){
 const arr=places.filter(p=>state.saved.includes(p.id));const box=document.getElementById('saved');
 box.innerHTML='<div class="section-title"><h3>Mentettek későbbre</h3><span class="muted">'+arr.length+' hely</span></div><div class="cards">'+(arr.length?arr.map(p=>`<article class="place-card"><img src="${p.image}"><div><h3>${p.name}</h3><p>${p.short}</p><div class="actions"><button class="small" data-open="${p.id}">Megnyitás</button><button class="small" data-remove="${p.id}">Eltávolítás</button></div></div></article>`).join(''):'<p class="muted">Még nincs elmentett hely.</p>')+'</div>';
 box.querySelectorAll('[data-open]').forEach(b=>b.addEventListener('click',()=>selectPlace(b.dataset.open,true)));
 box.querySelectorAll('[data-remove]').forEach(b=>b.addEventListener('click',()=>toggleSaved(b.dataset.remove)));
}
function toggleSaved(id){state.saved=state.saved.includes(id)?state.saved.filter(x=>x!==id):[...state.saved,id];save();renderAll();toast(state.saved.includes(id)?'Elmentve későbbre':'Eltávolítva');}
function renderAll(){renderTimeline();renderAround();renderGuide();renderSaved();document.getElementById('progress').textContent=state.done.length+' / '+places.length;}
function switchView(v){document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',b.dataset.view===v));['timeline','around','guide','saved'].forEach(id=>document.getElementById(id).hidden=id!==v);const s=document.getElementById('sheet');if(!s.classList.contains('mid')&&!s.classList.contains('full'))s.classList.add('mid');}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>switchView(b.dataset.view));
let sheetState=0;document.getElementById('handle').onclick=()=>{sheetState=(sheetState+1)%3;const s=document.getElementById('sheet');s.className='sheet'+(sheetState===1?' mid':sheetState===2?' full':'');};
document.getElementById('hub').onclick=()=>document.getElementById('hubmenu').classList.toggle('open');
document.getElementById('sync').onclick=()=>{document.getElementById('status').textContent='↻ Frissítés...';setTimeout(()=>{document.getElementById('status').textContent='🟢 Friss · most';toast('Demo-adatok frissítve')},700);};
document.getElementById('layers').onclick=()=>{if(map.hasLayer(line))map.removeLayer(line);else line.addTo(map);toast(map.hasLayer(line)?'Napi útvonal bekapcsolva':'Napi útvonal elrejtve');};
document.getElementById('radar').onclick=()=>switchView('around');
document.getElementById('gps').onclick=()=>{if(!navigator.geolocation)return toast('A böngésző nem támogatja a GPS-t');navigator.geolocation.getCurrentPosition(pos=>{L.circleMarker([pos.coords.latitude,pos.coords.longitude],{radius:9,color:'#fff',fillColor:'#318cff',fillOpacity:1}).addTo(map);map.setView([pos.coords.latitude,pos.coords.longitude],16);toast('Saját helyzet megjelenítve')},()=>toast('A helyzet nem érhető el'));};
function toast(t){const e=document.getElementById('toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),1400)}
renderAll();selectPlace(state.selected);
if('serviceWorker' in navigator)navigator.serviceWorker.register('./service-worker.js');
</script>
</body></html>
