<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#08111d">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="css/app.css">
<title>Travel Companion Alpha v0.3</title>
</head>
<body>
<div id="app">
  <div id="map"></div>

  <div class="top-strip" id="topStrip"><div class="pull-tab"></div></div>
  <div class="top-menu" id="topMenu">
    <h3>Travel Companion · Budapest</h3>
    <div class="menu-grid">
      <button class="menu-item" data-action="plan">📅 Tesztútiterv</button>
      <button class="menu-item" data-action="all">📍 Összes hely</button>
      <button class="menu-item" data-action="fit">🗺 Teljes Budapest</button>
      <button class="menu-item" data-action="versions">🧪 Verziók</button>
    </div>
  </div>

  <div class="status">🇭🇺 Budapest · Alpha v0.3</div>
  <button class="locate" id="locate">◎</button>

  <section class="sheet" id="sheet">
    <div class="handle-zone" id="handle"><div class="handle"></div></div>
    <div class="sheet-head" id="sheetHead">
      <div class="main"><h2 id="title">Budapest tesztútiterv</h2><p id="sub">3 laza nap · 24 hely</p></div>
    </div>
    <div class="sheet-content" id="content"></div>
  </section>

  <button class="context" id="context">
    <span class="context-symbol">🇭🇺</span>
    <span class="ai-badge" id="aiBadge">3</span>
  </button>
  <div class="context-menu" id="contextMenu">
    <button class="ca" data-action="plan">📅 Tesztútiterv</button>
    <button class="ca" data-action="nearby">◉ Körülöttem</button>
    <button class="ca" data-action="food">🍴 Éttermek és bárok</button>
    <button class="ca" data-action="ai">✨ 3 Companion-javaslat</button>
  </div>

  <div class="nav-card" id="navCard">
    <div class="nav-arrow" id="navArrow">↑</div>
    <div class="nav-copy"><b id="navTitle">Navigáció</b><span id="navMeta"></span></div>
    <button id="stopNav">×</button>
  </div>

  <div class="modal-backdrop" id="modalBackdrop">
    <div class="modal" id="modal"></div>
  </div>
  <div class="toast" id="toast"></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
