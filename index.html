<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
*{box-sizing:border-box}html,body,#map{height:100%;margin:0}body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#0b1117;overflow:hidden;color:#f5f7f8}
#map{position:fixed;inset:0;z-index:1;background:#dfe3df}.leaflet-control-zoom{display:none}.leaflet-tile-pane{filter:saturate(.58) brightness(1.06) contrast(.88)}
:root{--red:#e74750;--panel:rgba(12,17,22,.93);--line:rgba(255,255,255,.12);--muted:#aeb6bf}

/* LOGO */
.logo{position:fixed;z-index:1000;top:calc(env(safe-area-inset-top) + 8px);left:50%;transform:translateX(-50%);width:56px;height:56px;border-radius:50%;background:rgba(10,15,20,.74);backdrop-filter:blur(9px);box-shadow:0 5px 18px #0005}
.logo .flag{position:absolute;inset:4px;border-radius:50%;background:conic-gradient(from -30deg,#ce3039 0 8%,#f5f5f2 8% 16%,#378e59 16% 24%,transparent 24% 100%);-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 5px),#000 calc(100% - 4px));mask:radial-gradient(farthest-side,transparent calc(100% - 5px),#000 calc(100% - 4px))}
.logo .arrow{position:absolute;inset:0;display:grid;place-items:center;font-size:27px;color:#fff;transform:rotate(-42deg);text-shadow:0 2px 7px #000}

/* MAP BUTTONS */
.mapbtns{position:fixed;z-index:900;right:14px;bottom:112px;display:grid;gap:10px}.mapbtns button{width:46px;height:46px;border-radius:50%;border:1px solid var(--line);background:rgba(18,24,30,.78);backdrop-filter:blur(10px);color:#fff;font-size:21px}

/* MARKERS */
.tcmarker{width:45px;height:62px;position:relative}.tcmarker .ring{position:absolute;left:4px;top:10px;width:37px;height:37px;border-radius:50%;background:rgba(11,16,21,.82);box-shadow:0 3px 8px #0006}.tcmarker .ring:before{content:"";position:absolute;inset:-2px;border-radius:50%;background:conic-gradient(from 195deg,transparent 0 8%,#30363c 9% 48%,transparent 49% 55%,var(--day) 56% 86%,color-mix(in srgb,var(--day) 60%,var(--cat)) 91%,var(--cat) 94%,transparent 96%);-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 4px),#000 calc(100% - 3px));mask:radial-gradient(farthest-side,transparent calc(100% - 4px),#000 calc(100% - 3px))}.tcmarker .num{position:absolute;inset:0;display:grid;place-items:center;font-weight:800;font-size:17px}.tcmarker .cat{position:absolute;top:4px;left:50%;transform:translateX(-50%);height:20px;min-width:20px;padding:0 3px;border-radius:50%;display:grid;place-items:center;background:#11171d;border:1px solid #ffffff24;font-size:10px}.tcmarker .tip{position:absolute;top:45px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:8px solid transparent;border-right:8px solid transparent;border-top:14px solid #f2f4f5;filter:drop-shadow(0 2px 2px #0005)}

/* SHEET */
.sheet{position:fixed;z-index:950;left:0;right:0;bottom:0;background:var(--panel);border-top:1px solid var(--line);box-shadow:0 -12px 32px #0004;padding-bottom:env(safe-area-inset-bottom);overflow:hidden;transition:height .24s cubic-bezier(.22,.8,.25,1);touch-action:none}
.sheet.closed{height:calc(51px + env(safe-area-inset-bottom))}.sheet.info{height:calc(105px + env(safe-area-inset-bottom))}.sheet.third{height:34dvh}.sheet.two{height:67dvh}.sheet.full{height:calc(100dvh - env(safe-area-inset-top) - 7px)}
.drag{position:absolute;z-index:8;left:0;right:0;top:0;height:36px;touch-action:none}.handle{position:absolute;top:7px;left:50%;transform:translateX(-50%);width:44px;height:4px;border-radius:4px;background:#bac2caad}

/* closed notification */
.notice{position:absolute;top:18px;left:13px;right:13px;height:31px;display:flex;align-items:center;gap:8px;font-size:11px}.dot{width:8px;height:8px;border-radius:50%;background:var(--red)}.notice span{color:#b9c0c7}.notice button{margin-left:auto;width:28px;height:28px;border:0;border-radius:6px;background:#18212a;color:#fff;font-size:19px}.info .notice,.third .notice,.two .notice,.full .notice{display:none}

/* info mini */
.infocard{display:none;position:absolute;top:28px;left:12px;right:12px;height:64px;background:rgba(45,52,58,.72);border:1px solid var(--line);backdrop-filter:blur(13px);align-items:center;padding:7px;gap:9px}.info .infocard{display:flex}.thumb{width:47px;height:47px;background:#cdd0cf;display:grid;place-items:center;font-size:26px}.infotxt{display:flex;flex-direction:column}.infotxt b{font-size:13px}.infotxt span{font-size:10px;color:#c0c6cc;margin-top:4px}.infocard button{margin-left:auto;width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:#171d23;color:white}

/* content */
.content{display:none;height:100%;overflow:auto;padding:27px 12px 70px}.third .content,.two .content,.full .content{display:block}.dayhead{height:29px;display:flex;align-items:center;justify-content:space-between;font-size:12px}.dayhead span,.dayhead small{color:#b6bdc4}.filters{display:flex;gap:6px;overflow-x:auto;padding:4px 0 9px;scrollbar-width:none}.filters::-webkit-scrollbar{display:none}.filters button{flex:0 0 61px;height:53px;border:1px solid var(--line);border-radius:7px;background:#20272d;color:#f4f5f6;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:17px}.filters button span{font-size:8px}.filters .active{background:linear-gradient(#ed5a61,#c72f39);box-shadow:0 5px 13px #de38413b}
.list{border-top:1px solid #ffffff14}.place{min-height:72px;display:grid;grid-template-columns:3px 22px 1fr 63px;gap:8px;align-items:center;border-bottom:1px solid #ffffff14;padding:6px 0}.place .bar{height:53px;background:var(--red)}.place:nth-child(2) .bar{background:#65a97b}.place:nth-child(3) .bar{background:#d6a73b}.place:nth-child(4) .bar{background:#dd8741}.place:nth-child(5) .bar{background:#4b8dca}.place .n{align-self:start;margin-top:4px;width:18px;height:18px;border-radius:50%;display:grid;place-items:center;background:#252d33;font-size:10px;font-weight:700}.pcopy{display:flex;flex-direction:column}.pcopy b{font-size:12px}.pcopy span{font-size:9px;color:#b8bfc6;margin:3px 0}.pcopy small{font-size:9px;color:#e8b24a}.photo{width:63px;height:52px;border-radius:4px;background:#343d44;display:grid;place-items:center;font-size:29px}.third .place:not(:first-child){display:none}

/* nav only 2/3/full */
.tabs{display:none;position:absolute;left:0;right:0;bottom:env(safe-area-inset-bottom);height:60px;background:#0f151bcc;border-top:1px solid var(--line);backdrop-filter:blur(14px);align-items:center;justify-content:space-around}.two .tabs,.full .tabs{display:flex}.tabs button{border:0;background:none;color:#cbd0d5;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:18px}.tabs span{font-size:8px}.tabs .active{color:var(--red)}.tabs .plus{width:43px;height:43px;border-radius:50%;background:var(--red);color:white;font-size:30px;display:grid;place-items:center}

/* dev state dots - intentionally tiny, removable later */
.states{position:fixed;z-index:1100;left:9px;top:calc(env(safe-area-inset-top) + 10px);display:flex;gap:5px}.states button{width:7px;height:7px;border:0;border-radius:50%;padding:0;background:#ffffff55}.states button.on{background:#fff}

/* =========================================================
   Alpha 0.5.6 — Smooth Sheet + Themes + Auto Night
   ========================================================= */
html,body{overscroll-behavior:none;-webkit-text-size-adjust:100%}
body{--sheet-progress:0;--sheet-height:51px}

/* themes */
body.theme-light{
  --panel:rgba(244,240,232,.92);
  --line:rgba(24,30,36,.13);
  --muted:#68717a;
  color:#171b20;
}
body.theme-light .sheet{color:#171b20;box-shadow:0 -12px 28px #33404a22}
body.theme-light .notice span,
body.theme-light .infotxt span,
body.theme-light .pcopy span,
body.theme-light .dayhead span,
body.theme-light .dayhead small{color:#677078}
body.theme-light .infocard{background:rgba(247,243,235,.83)}
body.theme-light .infocard button{background:#e8e2d8;color:#171b20}
body.theme-light .filters button{background:rgba(235,230,220,.88);color:#171b20}
body.theme-light .tabs{background:rgba(244,240,232,.94)}
body.theme-light .tabs button{color:#565e66}
body.theme-light .leaflet-tile-pane{filter:saturate(.62) brightness(1.08) contrast(.86)!important}

body.theme-grey{
  --panel:rgba(17,23,29,.92);
  --line:rgba(255,255,255,.11);
  color:#f5f7f8;
}
body.theme-grey .leaflet-tile-pane{filter:saturate(.46) brightness(.78) contrast(.92)!important}

body.theme-night{
  --panel:rgba(4,8,12,.965);
  --line:rgba(255,255,255,.10);
  color:#f4f7f8;
}
body.theme-night .leaflet-tile-pane{
  filter:saturate(.30) brightness(.34) contrast(1.22) hue-rotate(175deg)!important;
}
body.theme-night .sheet{box-shadow:0 -12px 36px #000b}
body.theme-night .tcmarker{filter:drop-shadow(0 0 5px #ffffff1f)}
body.theme-night .filters .active{box-shadow:0 0 16px rgba(231,71,80,.35)}

/* continuous bottom sheet */
.sheet{
  transition:none!important;
  will-change:height;
  height:var(--sheet-height)!important;
}
.sheet.sheet-dragging{transition:none!important}
.sheet.sheet-settling{transition:height .30s cubic-bezier(.19,.83,.25,1)!important}

/* whole top/header area is forgiving drag zone */
.drag{
  height:56px!important;
  touch-action:none!important;
}
.handle{top:8px!important}

/* Instead of hard switching, contents fade in progressively */
.notice{
  opacity:calc(1 - min(1,var(--sheet-progress)*5));
  transition:opacity .08s linear;
}
.infocard{
  display:flex!important;
  opacity:clamp(0,calc((var(--sheet-progress) - .07)*8),1);
  transform:translateY(calc((1 - clamp(0,calc((var(--sheet-progress) - .07)*8),1))*8px));
  pointer-events:none;
}
.content{
  display:block!important;
  opacity:clamp(0,calc((var(--sheet-progress) - .19)*5),1);
  transform:translateY(calc((1 - clamp(0,calc((var(--sheet-progress) - .19)*5),1))*10px));
  overflow-y:hidden;
}
body.sheet-full .content{overflow-y:auto;-webkit-overflow-scrolling:touch}
.tabs{
  display:flex!important;
  opacity:clamp(0,calc((var(--sheet-progress) - .49)*5),1);
  pointer-events:none;
}
body.sheet-tabs .tabs{pointer-events:auto}

/* 1/3 view: only first card until progress grows */
.place{transition:opacity .12s linear,max-height .15s ease}
body:not(.sheet-list) .place:not(:first-child){
  opacity:0;max-height:0;min-height:0;padding:0;border:0;overflow:hidden;
}

/* map controls are physically attached above current sheet */
.mapbtns{transition:none!important;bottom:calc(var(--sheet-height) + 12px)!important}

/* marker category tint support */
.tcmarker{--cat:#e74750}

/* settings overlay */
.theme-sheet{
  position:fixed;inset:0;z-index:3000;background:rgba(0,0,0,.36);
  display:none;align-items:flex-start;justify-content:center;
  padding:calc(env(safe-area-inset-top) + 76px) 14px 14px;
  backdrop-filter:blur(5px);
}
.theme-sheet.open{display:flex}
.theme-sheet-card{
  width:min(410px,100%);background:rgba(15,21,27,.95);border:1px solid #ffffff20;
  box-shadow:0 18px 42px #0008;padding:14px;color:#f6f7f8;
}
.theme-sheet-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:11px}
.theme-sheet-head b{font-size:15px}
.theme-sheet-head button{border:0;background:#ffffff12;color:#fff;width:31px;height:31px;border-radius:50%;font-size:20px}
.theme-options{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.theme-options button{
  min-width:0;border:1px solid #ffffff18;background:#20272d;color:#fff;padding:8px 5px;
  display:flex;flex-direction:column;align-items:center;gap:3px;
}
.theme-options button.active{outline:2px solid #e74750;background:#293139}
.theme-options b{font-size:11px}.theme-options small{font-size:8px;color:#aeb6bf}
.swatch{width:42px;height:29px;border:1px solid #ffffff1c;display:block}
.light-swatch{background:linear-gradient(135deg,#e9e3d7,#c9d6ca)}
.grey-swatch{background:linear-gradient(135deg,#384149,#151a20)}
.night-swatch{background:linear-gradient(135deg,#122331,#03070b)}
.auto-night-row{
  margin-top:10px;padding:11px 0 4px;display:flex;align-items:center;gap:12px;border-top:1px solid #ffffff14
}
.auto-night-row div{display:flex;flex-direction:column;gap:3px;flex:1}
.auto-night-row b{font-size:11px}.auto-night-row span{font-size:8px;color:#aeb6bf}
.auto-night-row input{width:44px;height:24px;accent-color:#e74750}
.sun-status{font-size:8px;color:#909aa4;min-height:15px;padding-top:7px}

/* PWA page zoom protection */
input,select,textarea,button{font-size:max(16px,1em)}

</style>

<script>
const places=[
 [47.5022,19.0348,'1','⌂','Halászbástya','450 m','07:00–22:00','4,8','3246','🏰'],
 [47.5019,19.0342,'2','†','Mátyás-templom','600 m','08:00–18:00','4,7','2134','⛪'],
 [47.4962,19.0396,'3','⌂','Budai Vár','700 m','08:00–20:00','4,6','1867','🏛'],
 [47.4945,19.0424,'4','♢','Várkert Bazár','850 m','09:00–19:00','4,5','1286','🏰'],
 [47.4990,19.0436,'5','⌁','Széchenyi Lánchíd','1,0 km','00:00–24:00','4,7','5432','🌉'],
 [47.5050,19.0552,'6','☕','Lipótvárosi kávézó','1,2 km','07:00–20:00','4,6','892','☕']
];
const map=L.map('map',{zoomControl:false,attributionControl:false}).setView([47.4995,19.046],14);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19}).addTo(map);
places.forEach(p=>{
 const icon=L.divIcon({className:'',iconSize:[45,62],iconAnchor:[22,60],html:`<div class="tcmarker" style="--day:#e74750"><div class="ring"><div class="num">${p[2]}</div></div><div class="cat">${p[3]}</div><div class="tip"></div></div>`});
 L.marker([p[0],p[1]],{icon}).addTo(map);
});
L.polyline(places.map(p=>[p[0],p[1]]),{color:'#d84550',weight:3,opacity:.58}).addTo(map);

document.getElementById('list').innerHTML=places.map((p,i)=>`<div class="place"><i class="bar"></i><strong class="n">${p[2]}</strong><div class="pcopy"><b>${p[4]}</b><span>${p[5]} · Nyitva ${p[6]}</span><small>★ ${p[7]}　(${p[8]})</small></div><div class="photo">${p[9]}</div></div>`).join('');

const sheet=document.getElementById('sheet'),drag=document.getElementById('drag');
const names=['closed','info','third','two','full']; let idx=0,sy=0,sh=0,active=false;
function vh(){return visualViewport?.height||innerHeight}
function h(i){let v=vh();return [51,105,v*.34,v*.67,v-(parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--sat')||0)+7)][i]}
function setState(i){idx=Math.max(0,Math.min(4,i));names.forEach(n=>sheet.classList.remove(n));sheet.classList.add(names[idx]);sheet.style.height='';document.querySelectorAll('.states button').forEach((b,j)=>b.classList.toggle('on',j===idx))}
function start(y){active=true;sy=y;sh=sheet.getBoundingClientRect().height;sheet.style.transition='none'}
function move(y){if(!active)return;sheet.style.height=Math.max(51,Math.min(vh()-7,sh+sy-y))+'px'}
function finish(){if(!active)return;active=false;sheet.style.transition='';let cur=sheet.getBoundingClientRect().height,b=0,d=1e9;[51,105,vh()*.34,vh()*.67,vh()-7].forEach((x,i)=>{let q=Math.abs(cur-x);if(q<d){d=q;b=i}});setState(b)}
drag.addEventListener('pointerdown',e=>{drag.setPointerCapture?.(e.pointerId);start(e.clientY);e.preventDefault()});
drag.addEventListener('pointermove',e=>{if(active){move(e.clientY);e.preventDefault()}});
drag.addEventListener('pointerup',finish);drag.addEventListener('pointercancel',finish);
drag.addEventListener('touchstart',e=>start(e.touches[0].clientY),{passive:true});
drag.addEventListener('touchmove',e=>move(e.touches[0].clientY),{passive:true});
drag.addEventListener('touchend',finish,{passive:true});
document.getElementById('notice').onclick=()=>setState(1);document.getElementById('infocard').onclick=()=>setState(2);

const states=document.getElementById('states');names.forEach((n,i)=>{let b=document.createElement('button');b.onclick=()=>setState(i);states.appendChild(b)});setState(0);
document.getElementById('loc').onclick=()=>navigator.geolocation?.getCurrentPosition(pos=>map.setView([pos.coords.latitude,pos.coords.longitude],16));
</script>

<script id="alpha056">
(() => {
  const sheet = document.getElementById('sheet');
  if(!sheet) return;

  /* --- PWA registration --- */
  if('serviceWorker' in navigator){
    window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').catch(()=>{}));
  }

  /* --- replace old drag listeners with clean drag node --- */
  const oldDrag = document.getElementById('drag');
  const drag = oldDrag.cloneNode(true);
  oldDrag.replaceWith(drag);

  const vh = () => window.visualViewport?.height || window.innerHeight;
  const safeBottom = () => 0;
  const snapHeights = () => {
    const v = vh();
    return [
      51 + safeBottom(),
      Math.max(118, v * .145),
      v * .34,
      v * .67,
      v - 8
    ];
  };

  let currentH = snapHeights()[0];
  let startH = currentH;
  let startY = 0;
  let active = false;
  let lastY = 0;
  let lastT = 0;
  let velocity = 0;

  function progressFor(h){
    const s = snapHeights();
    return Math.max(0, Math.min(1, (h - s[0]) / (s[4] - s[0])));
  }

  function render(h){
    const s = snapHeights();
    currentH = Math.max(s[0], Math.min(s[4], h));
    document.body.style.setProperty('--sheet-height', currentH + 'px');
    const p = progressFor(currentH);
    document.body.style.setProperty('--sheet-progress', p.toFixed(4));

    document.body.classList.toggle('sheet-list', currentH >= s[3] - 20);
    document.body.classList.toggle('sheet-tabs', currentH >= s[3] - 20);
    document.body.classList.toggle('sheet-full', currentH >= s[4] - 40);

    // keep legacy class names meaningful for the rest of the demo
    const nearestIndex = s.reduce((best,x,i)=>Math.abs(x-currentH)<Math.abs(s[best]-currentH)?i:best,0);
    ['closed','info','third','two','full'].forEach(n=>sheet.classList.remove(n));
    sheet.classList.add(['closed','info','third','two','full'][nearestIndex]);
  }

  function settle(target){
    sheet.classList.remove('sheet-dragging');
    sheet.classList.add('sheet-settling');
    document.body.style.setProperty('--sheet-height', target + 'px');
    currentH = target;
    render(target);
    setTimeout(()=>sheet.classList.remove('sheet-settling'),320);
  }

  function nearestSnap(){
    const s=snapHeights();
    return s.reduce((a,b)=>Math.abs(b-currentH)<Math.abs(a-currentH)?b:a);
  }

  function nextSnap(direction){
    const s=snapHeights();
    if(direction<0) return s.find(x=>x>currentH+14) ?? s[s.length-1];
    return [...s].reverse().find(x=>x<currentH-14) ?? s[0];
  }

  function begin(clientY, pointerId){
    if(document.body.classList.contains('sheet-full') && document.querySelector('.content')?.scrollTop>0) return;
    active=true;
    startY=clientY; startH=currentH;
    lastY=clientY; lastT=performance.now(); velocity=0;
    sheet.classList.add('sheet-dragging');
    sheet.classList.remove('sheet-settling');
    try{drag.setPointerCapture(pointerId)}catch(_){}
  }
  function move(clientY){
    if(!active) return;
    const now=performance.now(), dt=Math.max(1,now-lastT);
    velocity=(clientY-lastY)/dt;
    lastY=clientY; lastT=now;
    render(startH + (startY-clientY));
  }
  function end(){
    if(!active)return;
    active=false;
    let target;
    if(Math.abs(velocity)>.42) target=nextSnap(velocity);
    else target=nearestSnap();
    settle(target);
  }

  drag.addEventListener('pointerdown',e=>{begin(e.clientY,e.pointerId);e.preventDefault()});
  drag.addEventListener('pointermove',e=>{if(active){move(e.clientY);e.preventDefault()}},{passive:false});
  drag.addEventListener('pointerup',end);
  drag.addEventListener('pointercancel',end);

  // make the first 58px of the panel itself draggable too
  sheet.addEventListener('pointerdown',e=>{
    if(e.target.closest('button,.filters,.place,.tabs,.infocard')) return;
    const y=e.clientY-sheet.getBoundingClientRect().top;
    if(y<=58){begin(e.clientY,e.pointerId);e.preventDefault()}
  });
  sheet.addEventListener('pointermove',e=>{if(active){move(e.clientY);e.preventDefault()}},{passive:false});
  sheet.addEventListener('pointerup',end);
  sheet.addEventListener('pointercancel',end);

  document.getElementById('notice')?.addEventListener('click',()=>settle(snapHeights()[1]));
  document.getElementById('infocard')?.addEventListener('click',()=>settle(snapHeights()[2]));

  // replace debug dots actions
  document.querySelectorAll('#states button').forEach((b,i)=>b.onclick=()=>settle(snapHeights()[i]));

  window.addEventListener('resize',()=>render(Math.min(currentH,snapHeights()[4])));
  render(currentH);

  /* --- marker tap -> Info Mini --- */
  setTimeout(()=>{
    document.querySelectorAll('.leaflet-marker-icon').forEach((m,i)=>{
      m.addEventListener('click',()=>{
        const p=places[i%places.length];
        document.querySelector('.infotxt b').textContent=p[4];
        document.querySelector('.infotxt span').textContent=p[5]+' · Nyitva '+p[6];
        document.querySelector('.thumb').textContent=p[9];
        settle(snapHeights()[1]);
      });
    });
  },0);

  /* --- category quick filters --- */
  document.querySelectorAll('.filters button').forEach((b,i)=>b.addEventListener('click',()=>{
    document.querySelectorAll('.filters button').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');
    document.querySelectorAll('.leaflet-marker-icon').forEach((m,j)=>{
      m.style.opacity = (i===0 || (j%5)===(i-1)) ? '1' : '.22';
    });
  }));

  /* --- Themes + automatic Night mode --- */
  const themeSheet=document.getElementById('themeSheet');
  const logo=document.querySelector('.logo');
  const close=document.getElementById('themeClose');
  const autoToggle=document.getElementById('autoNightToggle');
  const sunStatus=document.getElementById('sunStatus');

  const themeButtons=[...document.querySelectorAll('[data-theme]')];
  const allThemes=['theme-light','theme-grey','theme-night'];
  let preferredDayTheme=localStorage.getItem('tcDayTheme') || 'light';
  let manualTheme=localStorage.getItem('tcManualTheme') || preferredDayTheme;
  let autoNight=localStorage.getItem('tcAutoNight') !== 'false';
  autoToggle.checked=autoNight;

  function setVisualTheme(name){
    document.body.classList.remove(...allThemes);
    document.body.classList.add('theme-'+name);
    themeButtons.forEach(b=>b.classList.toggle('active',b.dataset.theme===name));
    const color = name==='light' ? '#e9e3d7' : name==='grey' ? '#11171d' : '#04080c';
    document.querySelector('meta[name="theme-color"]')?.setAttribute('content',color);
  }

  /* NOAA-style sunrise/sunset approximation, adequate for theme switching. */
  function solarTime(date,lat,lon,isSunrise){
    const rad=Math.PI/180;
    const N=Math.floor((date-Date.UTC(date.getUTCFullYear(),0,0))/86400000);
    const lngHour=lon/15;
    const t=N+(((isSunrise?6:18)-lngHour)/24);
    const M=(0.9856*t)-3.289;
    let L=M+(1.916*Math.sin(M*rad))+(0.020*Math.sin(2*M*rad))+282.634;
    L=(L+360)%360;
    let RA=Math.atan(0.91764*Math.tan(L*rad))/rad;
    RA=(RA+360)%360;
    const Lquad=Math.floor(L/90)*90, RAquad=Math.floor(RA/90)*90;
    RA=(RA+(Lquad-RAquad))/15;
    const sinDec=0.39782*Math.sin(L*rad);
    const cosDec=Math.cos(Math.asin(sinDec));
    const cosH=(Math.cos(90.833*rad)-(sinDec*Math.sin(lat*rad)))/(cosDec*Math.cos(lat*rad));
    if(cosH>1 || cosH<-1) return null;
    let H=(isSunrise ? 360-Math.acos(cosH)/rad : Math.acos(cosH)/rad)/15;
    const T=H+RA-(0.06571*t)-6.622;
    let UT=(T-lngHour)%24;if(UT<0)UT+=24;
    const d=new Date(Date.UTC(date.getUTCFullYear(),date.getUTCMonth(),date.getUTCDate(),0,0,0));
    d.setUTCMinutes(Math.round(UT*60));
    return d;
  }

  function coordsForTheme(){
    const c=map?.getCenter?.();
    return c ? {lat:c.lat,lon:c.lng} : {lat:47.4979,lon:19.0402};
  }

  function applyThemeLogic(){
    if(!autoNight){setVisualTheme(manualTheme);sunStatus.textContent='Automatikus váltás kikapcsolva.';return;}
    const c=coordsForTheme(), now=new Date();
    const rise=solarTime(now,c.lat,c.lon,true), set=solarTime(now,c.lat,c.lon,false);
    const dark=(rise&&set) ? (now<rise || now>=set) : (now.getHours()<6 || now.getHours()>=20);
    setVisualTheme(dark?'night':preferredDayTheme);
    const fmt=d=>d?d.toLocaleTimeString('hu-HU',{hour:'2-digit',minute:'2-digit'}):'—';
    sunStatus.textContent=`Napkelte ${fmt(rise)} · Napnyugta ${fmt(set)} · ${dark?'Night aktív':'Nappali téma aktív'}`;
  }

  themeButtons.forEach(b=>b.addEventListener('click',()=>{
    const t=b.dataset.theme;
    if(t==='night'){
      manualTheme='night';
    } else {
      preferredDayTheme=t; manualTheme=t;
      localStorage.setItem('tcDayTheme',preferredDayTheme);
    }
    localStorage.setItem('tcManualTheme',manualTheme);
    if(autoNight && t==='night'){
      autoNight=false;autoToggle.checked=false;localStorage.setItem('tcAutoNight','false');
    }
    applyThemeLogic();
  }));

  autoToggle.addEventListener('change',()=>{
    autoNight=autoToggle.checked;
    localStorage.setItem('tcAutoNight',String(autoNight));
    applyThemeLogic();
  });

  logo.addEventListener('click',()=>{themeSheet.classList.add('open');themeSheet.setAttribute('aria-hidden','false');applyThemeLogic()});
  close.addEventListener('click',()=>{themeSheet.classList.remove('open');themeSheet.setAttribute('aria-hidden','true')});
  themeSheet.addEventListener('click',e=>{if(e.target===themeSheet){themeSheet.classList.remove('open');themeSheet.setAttribute('aria-hidden','true')}});

  // if location is allowed, use actual position for sunset calculation
  navigator.geolocation?.getCurrentPosition(pos=>{
    try{map.setView([pos.coords.latitude,pos.coords.longitude],map.getZoom(),{animate:false})}catch(_){}
    applyThemeLogic();
  },()=>applyThemeLogic(),{maximumAge:600000,timeout:3000});

  applyThemeLogic();
  setInterval(applyThemeLogic,5*60*1000);
})();
</script>

</body></html>
