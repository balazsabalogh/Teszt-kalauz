<html lang="hu">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b1117">
<title>Travel Companion Alpha 0.5.5.2</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
*{box-sizing:border-box}html,body,#map{height:100%;margin:0}body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#0b1117;overflow:hidden;color:#f5f7f8}
#map{position:fixed;inset:0;z-index:1;background:#dfe3df}.leaflet-control-zoom{display:none}.leaflet-tile-pane{filter:saturate(.58) brightness(1.06) contrast(.88)}
:root{--red:#e74750;--panel:rgba(12,17,22,.93);--line:rgba(255,255,255,.12);--muted:#aeb6bf}

/* LOGO */
.logo{position:fixed;z-index:1000;top:calc(env(safe-area-inset-top) + 8px);left:50%;transform:translateX(-50%);width:56px;height:56px;border-radius:50%;background:rgba(10,15,20,.74);backdrop-filter:blur(9px);box-shadow:0 5px 18px #0005}
.logo .flag{position:absolute;inset:4px;border-radius:50%;background:conic-gradient(from -24deg,#ce3039 0 9%,#f5f5f2 9% 14%,#378e59 14% 23%,transparent 23% 100%);-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 5px),#000 calc(100% - 4px));mask:radial-gradient(farthest-side,transparent calc(100% - 5px),#000 calc(100% - 4px))}
.logo .arrow{position:absolute;inset:0;display:grid;place-items:center;font-size:27px;color:#fff;transform:rotate(-42deg);text-shadow:0 2px 7px #000}

/* MAP BUTTONS */
.mapbtns{position:fixed;z-index:900;right:14px;bottom:112px;display:grid;gap:10px}.mapbtns button{width:46px;height:46px;border-radius:50%;border:1px solid var(--line);background:rgba(18,24,30,.78);backdrop-filter:blur(10px);color:#fff;font-size:21px}

/* MARKERS */
.tcmarker{width:45px;height:62px;position:relative}.tcmarker .ring{position:absolute;left:4px;top:10px;width:37px;height:37px;border-radius:50%;background:rgba(11,16,21,.82);box-shadow:0 3px 8px #0006}.tcmarker .ring:before{content:"";position:absolute;inset:-2px;border-radius:50%;background:conic-gradient(from 195deg,transparent 0 8%,#30363c 9% 48%,transparent 49% 55%,var(--day) 56% 86%,color-mix(in srgb,var(--day) 45%,var(--cat)) 90%,var(--cat) 94%,transparent 96%);-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 4px),#000 calc(100% - 3px));mask:radial-gradient(farthest-side,transparent calc(100% - 4px),#000 calc(100% - 3px))}.tcmarker .num{position:absolute;inset:0;display:grid;place-items:center;font-weight:800;font-size:17px}.tcmarker .cat{position:absolute;top:4px;left:50%;transform:translateX(-50%);height:20px;min-width:20px;padding:0 3px;border-radius:50%;display:grid;place-items:center;background:#11171d;border:1px solid #ffffff24;font-size:10px}.tcmarker .tip{position:absolute;top:45px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:8px solid transparent;border-right:8px solid transparent;border-top:14px solid #f2f4f5;filter:drop-shadow(0 2px 2px #0005)}

/* SHEET */
.sheet{position:fixed;z-index:950;left:0;right:0;bottom:0;background:var(--panel);border-top:1px solid var(--line);box-shadow:0 -12px 32px #0004;padding-bottom:env(safe-area-inset-bottom);overflow:hidden;transition:height .24s cubic-bezier(.22,.8,.25,1);touch-action:none}
.sheet.closed{height:calc(51px + env(safe-area-inset-bottom))}.sheet.info{height:calc(105px + env(safe-area-inset-bottom))}.sheet.third{height:34dvh}.sheet.two{height:67dvh}.sheet.full{height:calc(100dvh - env(safe-area-inset-top) - 7px)}
.drag{position:absolute;z-index:8;left:0;right:0;top:0;height:36px;touch-action:none}.handle{position:absolute;top:7px;left:50%;transform:translateX(-50%);width:44px;height:4px;border-radius:4px;background:#bac2caad}

/* closed notification */
.notice{position:absolute;top:18px;left:13px;right:13px;height:31px;display:flex;align-items:center;gap:8px;font-size:11px}.dot{width:8px;height:8px;border-radius:50%;background:var(--red)}.notice span{color:#b9c0c7}.notice button{margin-left:auto;width:28px;height:28px;border:0;border-radius:6px;background:#18212a;color:#fff;font-size:19px}.info .notice,.third .notice,.two .notice,.full .notice{display:none}

/* info mini */
.infocard{display:none;position:absolute;top:28px;left:12px;right:12px;height:64px;background:rgba(45,52,58,.72);border:1px solid var(--line);backdrop-filter:blur(13px);align-items:center;padding:7px;gap:9px}.info .infocard{display:flex}.thumb{width:47px;height:47px;background:#cdd0cf;display:grid;place-items:center;font-size:26px}.infotxt{display:flex;flex-direction:column}.infotxt b{font-size:13px}.infotxt span{font-size:10px;color:#c0c6cc;margin-top:4px}.infocard button{margin-left:auto;width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:#171d23;color:white}

/* content */
.content{display:none;height:100%;overflow:auto;padding:27px 12px 70px}.third .content,.two .content,.full .content{display:block}.dayhead{height:29px;display:flex;align-items:center;justify-content:space-between;font-size:12px}.dayhead span,.dayhead small{color:#b6bdc4}.filters{display:flex;gap:6px;overflow-x:auto;padding:4px 0 9px;scrollbar-width:none}.filters::-webkit-scrollbar{display:none}.filters button{flex:0 0 61px;height:53px;border:1px solid var(--line);border-radius:7px;background:#20272d;color:#f4f5f6;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:17px}.filters button span{font-size:8px}.filters .active{background:linear-gradient(#ed5a61,#c72f39);box-shadow:0 5px 13px #de38413b}
.list{border-top:1px solid #ffffff14}.place{min-height:72px;display:grid;grid-template-columns:3px 22px 1fr 63px;gap:8px;align-items:center;border-bottom:1px solid #ffffff14;padding:6px 0}.place .bar{height:53px;background:var(--red)}.place:nth-child(2) .bar{background:#65a97b}.place:nth-child(3) .bar{background:#d6a73b}.place:nth-child(4) .bar{background:#dd8741}.place:nth-child(5) .bar{background:#4b8dca}.place .n{align-self:start;margin-top:4px;width:18px;height:18px;border-radius:50%;display:grid;place-items:center;background:#252d33;font-size:10px;font-weight:700}.pcopy{display:flex;flex-direction:column}.pcopy b{font-size:12px}.pcopy span{font-size:9px;color:#b8bfc6;margin:3px 0}.pcopy small{font-size:9px;color:#e8b24a}.photo{width:63px;height:52px;border-radius:4px;background:#343d44;display:grid;place-items:center;font-size:29px}.third .place:not(:first-child){display:none}

/* nav only 2/3/full */
.tabs{display:none;position:absolute;left:0;right:0;bottom:env(safe-area-inset-bottom);height:60px;background:#0f151bcc;border-top:1px solid var(--line);backdrop-filter:blur(14px);align-items:center;justify-content:space-around}.two .tabs,.full .tabs{display:flex}.tabs button{border:0;background:none;color:#cbd0d5;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:18px}.tabs span{font-size:8px}.tabs .active{color:var(--red)}.tabs .plus{width:43px;height:43px;border-radius:50%;background:var(--red);color:white;font-size:30px;display:grid;place-items:center}

/* dev state dots - intentionally tiny, removable later */
.states{position:fixed;z-index:1100;left:9px;top:calc(env(safe-area-inset-top) + 10px);display:flex;gap:5px}.states button{width:7px;height:7px;border:0;border-radius:50%;padding:0;background:#ffffff55}.states button.on{background:#fff}

.themebtn{position:fixed;z-index:1100;left:14px;top:calc(env(safe-area-inset-top) + 14px);width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:rgba(18,24,30,.72);backdrop-filter:blur(10px);color:#fff;font-size:19px}
body.light{--panel:rgba(247,244,237,.93);--line:rgba(20,25,30,.13);color:#171b1f}
.light .sheet{color:#171b1f}.light .filters button{background:rgba(242,239,232,.92);color:#171b1f}.light .tabs{background:rgba(247,244,237,.96)}.light .tabs button{color:#555d64}.light .notice span,.light .infotxt span,.light .pcopy span,.light .dayhead span,.light .dayhead small{color:#687078}.light .infocard{background:rgba(244,241,234,.88)}.light .infocard button{background:#ebe7de;color:#171b1f}.light .leaflet-tile-pane{filter:saturate(.58) brightness(1.08) contrast(.86)!important}
body.grey{--panel:rgba(18,23,28,.92)}.grey .leaflet-tile-pane{filter:saturate(.46) brightness(.78) contrast(.92)!important}
body.night{--panel:rgba(4,8,12,.96)}.night .leaflet-tile-pane{filter:saturate(.32) brightness(.34) contrast(1.2) hue-rotate(175deg)!important}.night .tcmarker{filter:drop-shadow(0 0 5px #ffffff24)}
/* Hungary identity is deliberately subtle; day colour remains a separate information system */
.country-accent{border-left:3px solid #ce3039!important;box-shadow:inset 1px 0 #f5f5f2,inset 3px 0 #378e59}
.sonar-pulse{position:fixed;z-index:800;width:18px;height:18px;border:2px solid #e74750;border-radius:50%;pointer-events:none;animation:ping 1.1s ease-out forwards}@keyframes ping{to{transform:scale(15);opacity:0}}
</style>

 if(sonarOn)[[.003,.004,'☕'],[-.002,.005,'WC'],[.001,-.006,'🍴']].forEach(q=>{let ic=L.divIcon({className:'',iconSize:[34,34],html:`<div style="width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:rgba(15,21,27,.8);border:1px solid #ffffff35;color:#fff">${q[2]}</div>`});sonarLayers.push(L.marker([c.lat+q[0],c.lng+q[1]],{icon:ic}).addTo(map))})

const sheet=document.getElementById('sheet'),drag=document.getElementById('drag');

function vh(){return visualViewport?.height||innerHeight}

function setState(i){idx=Math.max(0,Math.min(4,i));names.forEach(n=>sheet.classList.remove(n));sheet.classList.add(names[idx]);sheet.style.height='';document.querySelectorAll('.states button').forEach((b,j)=>b.classList.toggle('on',j===idx))}

function finish(){if(!active)return;active=false;sheet.style.transition='';let cur=sheet.getBoundingClientRect().height,b=0,d=1e9;[51,105,vh()*.34,vh()*.67,vh()-7].forEach((x,i)=>{let q=Math.abs(cur-x);if(q<d){d=q;b=i}});setState(b)}
drag.addEventListener('pointerdown',e=>{drag.setPointerCapture?.(e.pointerId);start(e.clientY);e.preventDefault()});

document.getElementById('notice').onclick=()=>setState(1);document.getElementById('infocard').onclick=()=>setState(2);

 if(sonarOn)[[.003,.004,'☕'],[-.002,.005,'WC'],[.001,-.006,'🍴']].forEach(q=>{let ic=L.divIcon({className:'',iconSize:[34,34],html:`<div style="width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:rgba(15,21,27,.8);border:1px solid #ffffff35;color:#fff">${q[2]}</div>`});sonarLayers.push(L.marker([c.lat+q[0],c.lng+q[1]],{icon:ic}).addTo(map))})

<style id="continuous-sheet-patch">
.sheet{transition:none!important;will-change:height;touch-action:none;overflow:hidden}
.sheet.dragging{transition:none!important}.sheet.settling{transition:height .26s cubic-bezier(.2,.8,.2,1)!important}
.handle{height:34px!important;padding-top:8px;cursor:grab;touch-action:none}
.sheet-scroll{height:calc(100% - 34px);overflow-y:hidden;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.sheet.full .sheet-scroll{overflow-y:auto;touch-action:pan-y}
.mapbtns{transition:none!important;will-change:bottom}
</style>
<script>
(() => {
 const sh=document.querySelector('.sheet'), handle=sh?.querySelector('.handle');
 if(!sh||!handle)return;
 let sc=sh.querySelector('.sheet-scroll');
 if(!sc){sc=document.createElement('div');sc.className='sheet-scroll';[...sh.children].filter(x=>x!==handle).forEach(x=>sc.appendChild(x));sh.appendChild(sc)}
 const vh=()=>window.innerHeight, minH=()=>Math.max(64,Math.min(88,vh()*.09)), infoH=()=>Math.max(150,Math.min(205,vh()*.22)),
 thirdH=()=>vh()*.34,twoH=()=>vh()*.66,fullH=()=>vh()*.985,snaps=()=>[minH(),infoH(),thirdH(),twoH(),fullH()];
 let h=parseFloat(getComputedStyle(sh).height)||minH(),sy=0,sh0=h,drag=false,ly=0,lt=0,vel=0;
 function apply(n){h=Math.max(minH(),Math.min(fullH(),n));sh.style.height=h+'px';let b=document.querySelector('.mapbtns');if(b)b.style.bottom=(h+12)+'px';sh.classList.toggle('full',h>vh()*.84)}
 function settle(t){sh.classList.remove('dragging');sh.classList.add('settling');apply(t);setTimeout(()=>sh.classList.remove('settling'),280)}
 function nearest(){return snaps().reduce((a,b)=>Math.abs(b-h)<Math.abs(a-h)?b:a)}
 function down(e){if(sh.classList.contains('full')&&sc.scrollTop>0)return;drag=true;sy=e.clientY;sh0=h;ly=e.clientY;lt=performance.now();vel=0;sh.classList.add('dragging');sh.classList.remove('settling');try{e.currentTarget.setPointerCapture(e.pointerId)}catch(_){}}
